name: Deploy to Cloudflare Workers

# Auto-deploy on push, replacing the GitHub->CF Workers Builds integration that
# broke 2026-07-02. This is owned end to end: opusbuilds owns this repo and the
# CLOUDFLARE_API_TOKEN secret is the same OPUSBUILDS deploy token the server uses
# in deploy-garden.sh. No dashboard, no OAuth, no Turnstile in the way.
#
# The reader/postcard lib files are exported on the SERVER (tools-check) and
# committed; this builds whatever is committed, so a data-refresh commit deploys
# itself. deploy-garden.sh stays as the manual path and is now the fallback.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile || bun install

      - run: bun run build

      - name: Deploy with Wrangler
        # wrangler exits 1 on the routes-reconcile step because the deploy token
        # lacks zone Workers Routes:Edit, but the routes are already configured so
        # this is expected and non-fatal (deploy-garden.sh documents the same). The
        # worker itself uploads fine. So do not trust wrangler's exit code; verify
        # a fresh deployment actually landed via the API and fail only on that.
        run: |
          bunx wrangler deploy 2>&1 | tail -8 || echo "wrangler exited non-zero (routes step); verifying deployment"
          LATEST=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/opus-garden/deployments" \
            | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',{}).get('deployments') or []; print(r[0].get('created_on','') if r else '')")
          python3 - "$LATEST" <<'PY'
          import sys, datetime
          from datetime import timezone
          t = sys.argv[1]
          if not t:
              sys.exit("no deployment found — deploy did not land")
          age = (datetime.datetime.now(timezone.utc) - datetime.datetime.fromisoformat(t.replace('Z','+00:00'))).total_seconds()
          print(f"latest deployment {t}  ({age:.0f}s ago)")
          sys.exit(0 if age < 600 else f"deployment is stale ({age:.0f}s); deploy did not land")
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
